name: Deploy to GitHub Pages

# Pushing to either branch republishes the whole site, because GitHub Pages serves a
# single artifact per repo: prod at /VibeOnDuty/ and staging at /VibeOnDuty/next/ are
# built together and uploaded as one tree.
on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Gate: the deploy runs only if lint, types, unit and e2e all pass. Without this,
  # deploy.yml and test.yml raced and a red build still shipped.
  tests:
    uses: ./.github/workflows/test.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod
          fetch-depth: 0        # tags, so the build stamp can name a release

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build prod
        working-directory: prod
        run: npm ci && npm run build

      - name: Does a develop branch exist?
        id: staging
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}" develop >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No develop branch yet — publishing prod only."
          fi

      - name: Check out develop (staging)
        if: steps.staging.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: develop
          path: staging
          fetch-depth: 0

      - name: Build staging into /next/
        if: steps.staging.outputs.exists == 'true'
        working-directory: staging
        env:
          PUBLIC_BASE: /VibeOnDuty/next/
          BUILD_BRANCH: develop
        run: |
          npm ci && npm run build
          mkdir -p ../prod/dist/next
          cp -r dist/* ../prod/dist/next/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: prod/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
