name: Tests

# workflow_call lets deploy.yml depend on this exact job instead of duplicating the
# steps, so "tests pass" and "what gets deployed" can never drift apart.
on:
  push:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Disable unused Chrome package source
        # Playwright downloads its own Chromium. A broken Google apt index on the
        # hosted runner must not block installation of Ubuntu system libraries.
        shell: bash
        run: |
          for source_file in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source_file" ] || continue
            if grep -qE 'https?://dl\.google\.com/linux/chrome' "$source_file"; then
              sudo mv "$source_file" "$source_file.disabled"
            fi
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
